      <rect width="470" height="152" fill="#fff"/>
      <g stroke="#000" fill="none" stroke-linecap="round">
        <path d="M22 50 L21 84" stroke-width="2.4"/>            <!-- soleira -->
        <path d="M136 37 L136 70" stroke-width="2.6"/>          <!-- coronha | caixa -->
        <path d="M140 54.5 L242 54.5" stroke-width="2.2"/>      <!-- superior | inferior -->
        <path d="M246 37 L246 66" stroke-width="2.6"/>          <!-- caixa | guarda-mão -->
        <path d="M236 78 L242 124" stroke-width="2"/>           <!-- nervura do carregador -->
        <path d="M150 112 L170 114" stroke-width="2"/>          <!-- base da empunhadura -->
      </g>
      <g fill="#000">
        <path d="M40 52 L84 49 L84 56 L42 61 Z"/>               <!-- vazado da coronha -->
        <rect x="258" y="44" width="11" height="5" rx="2.5"/><rect x="276" y="44" width="11" height="5" rx="2.5"/><rect x="294" y="44" width="11" height="5" rx="2.5"/><rect x="312" y="44" width="11" height="5" rx="2.5"/>
        <rect x="258" y="55" width="11" height="5" rx="2.5"/><rect x="276" y="55" width="11" height="5" rx="2.5"/><rect x="294" y="55" width="11" height="5" rx="2.5"/><rect x="312" y="55" width="11" height="5" rx="2.5"/>
        <path d="M196 72 L220 72 Q222 72 222 75 L222 81 Q222 84 219 84 L200 84 Q196 84 196 80 Z"/>  <!-- guarda-mato -->
        <path d="M442 50 L452 50 L452 51.5 L442 51.5 Z"/><path d="M442 54 L452 54 L452 55.5 L442 55.5 Z"/>  <!-- fendas do quebra-chamas -->
      </g>
      <path d="M205 72 Q209 77 206 82" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="#fff" mask="url(#c)">
