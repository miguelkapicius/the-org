<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 152">
  <!-- flashbang: lata alta com o estouro de luz atrás, espoleta, colher e argola. v3 (2026-11-05): lata mais grossa
       (34 em vez de 24; usuário achou fina demais), ainda mais estreita que a smoke (52), e o estouro continua sendo o
       que diferencia as duas no tamanho do card -->
  <defs>
    <!-- o estouro não encosta no corpo: folga em volta da lata -->
    <mask id="folga" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="152">
      <rect width="112" height="152" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round">
        <path d="M31 74 Q31 58 39 54 L57 54 Q65 58 65 74 L65 140 Q65 146 59 146 L37 146 Q31 146 31 140 Z"/>
        <rect x="39" y="36" width="18" height="18" rx="3"/>
        <path d="M46 32 L66 32 Q72 32 72 40 L72 118 L68 118 L68 42 Q68 37 64 37 L46 37 Z"/>
        <circle cx="26" cy="44" r="7"/>
      </g>
    </mask>
    <mask id="cortes" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="152">
      <rect width="112" height="152" fill="#fff"/>
      <g stroke="#000" fill="none" stroke-width="2.6" stroke-linecap="round">
        <path d="M34 82 L62 82"/><path d="M34 132 L62 132"/>
      </g>
      <rect x="44" y="92" width="8" height="30" rx="4" fill="#000"/>
    </mask>
  </defs>
  <!-- estouro de luz (10 pontas), mais claro que o corpo -->
  <polygon mask="url(#folga)" fill="#fff" fill-opacity="0.55"
    points="46,8 52,38 76,18 64,46 104,44 72,60 100,84 66,72 68,104 48,76 28,100 32,70 2,78 28,58 4,38 34,44 20,16 42,36"/>
  <g fill="#fff" mask="url(#cortes)">
    <path d="M31 74 Q31 58 39 54 L57 54 Q65 58 65 74 L65 140 Q65 146 59 146 L37 146 Q31 146 31 140 Z"/>
    <rect x="39" y="36" width="18" height="18" rx="3"/>
    <path d="M46 32 L66 32 Q72 32 72 40 L72 116 Q72 120 69 120 L68 120 L68 42 Q68 37 64 37 L46 37 Z"/>
    <path d="M25 41 L40 41 L40 46 L25 46 Z"/>
  </g>
  <circle cx="22" cy="50" r="6.5" fill="none" stroke="#fff" stroke-width="3.5"/>
</svg>
