<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 168">
  <!-- Glock-18. Proporção do CS2: ferrolho+armação grossos (~0,23 do comprimento), punho curto (~1,9x) e largo (~1/3),
       costas com entalhe côncavo, base inclinada (perpendicular ao punho). Guarda-mato de frente reta. Risquinhos da casa. -->
  <defs>
    <mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="250" height="168">
      <rect width="250" height="168" fill="#fff"/>
      <g stroke="#000" fill="none" stroke-linecap="round" stroke-width="2">
        <path d="M40 35 L40 55"/><path d="M47 35 L47 55"/><path d="M54 35 L54 55"/><path d="M61 35 L61 55"/>   <!-- serrilha -->
        <path d="M30 62.5 L226 62.5" stroke-width="2.4"/>                                                         <!-- ferrolho | armação -->
        <path d="M44 148 L86 155" stroke-width="2.2"/>                                                            <!-- base do carregador -->
      </g>
      <g fill="#000">
        <path d="M122 76 L162 76 Q165 76 165 79 L165 91 Q165 96 160 96 L128 96 Q121 96 121 90 Z"/>              <!-- furo do guarda-mato -->
        <circle cx="190" cy="55" r="2.3"/>
      </g>
      <path d="M131 76 Q137 82 133 90" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>    <!-- gatilho -->
    </mask>
  </defs>
  <g fill="#fff" mask="url(#c)">
    <path d="M28 32 Q28 28 32 28 L228 28 Q232 28 232 32 L232 63 L28 63 Z"/>                                   <!-- ferrolho -->
    <path d="M34 24 L44 24 L44 28 L34 28 Z"/><path d="M222 24 L228 24 L228 28 L222 28 Z"/>                      <!-- miras -->
    <path d="M30 62 L228 62 L228 74 L172 75 L112 74 Z"/>                                                       <!-- armação -->
    <path d="M110 70 L168 70 Q172 70 172 74 L172 94 Q172 104 162 104 L122 104 Q112 104 112 96 Z"/>             <!-- guarda-mato -->
    <path d="M26 62 L114 64 L112 98 Q104 102 102 112 L94 152 Q92 161 84 160 L36 152 Q26 150 27 141 C30 122 34 104 38 92 C40 84 34 78 26 72 Q22 66 26 62 Z"/>
  </g>
</svg>
