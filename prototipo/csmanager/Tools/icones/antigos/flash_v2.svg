<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 152">
  <!-- flashbang: lata FINA e alta (a smoke é larga e baixa) com o estouro de luz atrás, espoleta, colher e argola.
       Diferente da smoke pela silhueta (fina + raios), não só pelos furos, que somem no tamanho do card -->
  <defs>
    <!-- o estouro não encosta no corpo: folga em volta da lata -->
    <mask id="folga" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="152">
      <rect width="112" height="152" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round">
        <path d="M36 74 Q36 58 42 54 L54 54 Q60 58 60 74 L60 140 Q60 146 54 146 L42 146 Q36 146 36 140 Z"/>
        <rect x="40" y="36" width="16" height="18" rx="3"/>
        <path d="M46 32 L62 32 Q68 32 68 40 L68 118 L64 118 L64 42 Q64 37 60 37 L46 37 Z"/>
        <circle cx="31" cy="44" r="7"/>
      </g>
    </mask>
    <mask id="cortes" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="152">
      <rect width="112" height="152" fill="#fff"/>
      <g stroke="#000" fill="none" stroke-width="2.4" stroke-linecap="round">
        <path d="M38 82 L58 82"/><path d="M38 132 L58 132"/>
      </g>
      <rect x="45" y="92" width="6" height="30" rx="3" fill="#000"/>
    </mask>
  </defs>
  <!-- estouro de luz (10 pontas), mais claro que o corpo -->
  <polygon mask="url(#folga)" fill="#fff" fill-opacity="0.55"
    points="46,8 52,38 76,18 64,46 100,44 70,60 96,82 64,72 66,104 48,76 30,100 34,70 4,78 30,58 6,38 36,44 22,16 42,36"/>
  <g fill="#fff" mask="url(#cortes)">
    <path d="M36 74 Q36 58 42 54 L54 54 Q60 58 60 74 L60 140 Q60 146 54 146 L42 146 Q36 146 36 140 Z"/>
    <rect x="40" y="36" width="16" height="18" rx="3"/>
    <path d="M46 32 L62 32 Q68 32 68 40 L68 116 Q68 120 65 120 L64 120 L64 42 Q64 37 60 37 L46 37 Z"/>
    <path d="M30 41 L41 41 L41 46 L30 46 Z"/>
  </g>
  <circle cx="27" cy="50" r="6.5" fill="none" stroke="#fff" stroke-width="3.5"/>
</svg>
